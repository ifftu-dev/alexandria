[package]
name = "alexandria"
version = "0.1.0"
description = "Alexandria developer CLI"
edition = "2021"
rust-version = "1.83.0"

[[bin]]
name = "alexandria"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
owo-colors = "4"
indicatif = "0.18.6"
rusqlite = { version = "0.38", features = ["bundled-sqlcipher"] }
dirs = "6"
anyhow = "1"
log = "0.4"
bytesize = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
blake2 = "0.10"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Must stay on the same major as src-tauri's ed25519-dalek: the CLI passes
# `SigningKey`s to and from app_lib (governance signing, the vault's
# `Issuer`), so the two crates have to agree on the type. Cargo unifies them
# through the workspace lock.
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
clap_complete = "4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
crossterm = "0.29"

# `alexandria credentials` shares its functions with the Tauri backend so
# `credentials::store::list`, `credentials::bundle::export` and
# `credentials::bundle::verify_offline` stay one source of truth. The package
# name in src-tauri/Cargo.toml is `alexandria-node`; the [lib] name is
# `app_lib`, which is what we use for imports (`app_lib::credentials`). This
# pulls in the full app_lib transitive tree (pallas, iroh, libp2p…) which
# slows CLI builds, but it's the correctness vs ergonomics trade we're
# explicitly making per the `alexandria credentials` design.
alexandria-node = { path = "../src-tauri" }

[dev-dependencies]
tempfile = "3"
