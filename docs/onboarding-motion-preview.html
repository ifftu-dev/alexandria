function cancelUI(cancelPending=true){if(cancelPending){epoch++;clearTimeout(flowTimer);}uiAnimations.forEach(a=>a.cancel());uiAnimations=[];root.querySelectorAll('.flying-avatar').forEach(n=>n.remove());const a=el('selected-avatar');if(a)a.style.opacity='';}
function animate(node,frames,duration=200){if(reduced()||!node)return null;const a=node.animate(frames,{duration,easing:'cubic-bezier(.2,.8,.2,1)'});uiAnimations.push(a);return a;}
  const ns='http://www.w3.org/2000/svg';
  const vertices=[[512,204,-210,-370],[280,320,-410,-100],[280,632,-340,260],[512,748,170,360],[744,632,390,180],[744,320,330,-260]];
  vertices.forEach(([x,y,dx,dy],i)=>{
    const point=document.createElementNS(ns,'circle');point.setAttribute('cx',x);point.setAttribute('cy',y);point.setAttribute('r',i%2?13:18);point.classList.add('boot-point');point.id='boot-point-'+i;el('boot-points').append(point);
    const ray=document.createElementNS(ns,'line');ray.setAttribute('x1',x+dx);ray.setAttribute('y1',y+dy);ray.setAttribute('x2',x);ray.setAttribute('y2',y);ray.classList.add('boot-ray');ray.id='boot-ray-'+i;el('boot-rays').append(ray);
  });
  function startOpening(){
    endBoot();
    stageWidth=el('product').offsetWidth;stageHeight=el('product').offsetHeight;

    const pace=Number(el('speed').value);
    const ease='cubic-bezier(.22,.8,.18,1)';
    const animate=(node,frames,duration,delay=0,easing=ease)=>{
      const a=node.animate(frames,{duration:duration*pace,delay:delay*pace,easing,fill:'both'});bootAnimations.push(a);return a;
    };
    el('boot').hidden=false;el('product').classList.add('is-booting');el('content').inert=true;
    el('launch-state').textContent=pace===1?'Connecting ideas → forming the mark → arriving in the app.':'Slow-motion inspection: the same 1.2-second sequence at 0.4× speed.';
    const source=el('boot-logo').getBoundingClientRect(),target=(el('arrival-mark')||el('small-mark')).getBoundingClientRect();
    const dx=target.x+target.width/2-source.x-source.width/2,dy=target.y+target.height/2-source.y-source.height/2;
    const scale=target.width/source.width;
    animate(el('content'),[{opacity:0},{opacity:0,offset:.62},{opacity:1}],1200,0,'linear');

    animate(el('boot-orbit'),[{opacity:0,transform:'scale(.4)'},{opacity:.18,offset:.25},{opacity:0,transform:'scale(1.4)'}],650,240);
    vertices.forEach(([x,y,dx,dy],i)=>{
      animate(el('boot-point-'+i),[{opacity:0,transform:`translate(${dx}px,${dy}px)`},{opacity:1,offset:.12},{opacity:1,transform:'translate(0px,0px)',offset:.75},{opacity:0,transform:'translate(0px,0px)'}],570,i*22,'linear');
      animate(el('boot-ray-'+i),[{opacity:0},{opacity:.18,offset:.2},{opacity:0}],470,i*22,'linear');
    });
    animate(el('boot-outline'),[{strokeDashoffset:'1'},{strokeDashoffset:'0'}],470,130);
    animate(el('boot-crown'),[{strokeDashoffset:'1'},{strokeDashoffset:'0'}],210,250);
    animate(el('boot-spine'),[{strokeDashoffset:'1'},{strokeDashoffset:'0'}],280,330);
    animate(el('boot-arms'),[{strokeDashoffset:'1'},{strokeDashoffset:'0'}],310,380);
    animate(el('boot-tile'),[{opacity:0,transform:'scale(.6) rotate(-9deg)'},{opacity:1,transform:'scale(1) rotate(0deg)'}],350,430);
    animate(el('boot-ink'),[{stroke:getComputedStyle(el('product')).getPropertyValue('--p-brand').trim()},{stroke:'#ffffff'}],260,450);
    animate(el('boot-echo'),[{opacity:0},{opacity:.16}],240,530);
    animate(el('boot-type'),[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'translateY(0)',offset:.4},{opacity:1,offset:.66},{opacity:0,transform:'translateY(-5px)'}],610,330,'linear');
    animate(el('boot-logo'),[{transform:'translate(0px,0px) scale(1)'},{transform:`translate(${dx}px,${dy}px) scale(${scale})`}],440,760);
    animate(el('boot'),[{backgroundColor:getComputedStyle(el('product')).getPropertyValue('--p-bg').trim()},{backgroundColor:'transparent'}],290,790);

    animate(el('content').querySelector('.app-body'),[{transform:'translateY(10px)'},{transform:'translateY(0)'}],330,870);
    bootTimers.push(setTimeout(()=>{endBoot();announce();},1200*pace));
  }

function steps(){return [{id:'welcome',label:'Welcome'},{id:'roles',label:'Your roles'},{id:'birthdate',label:'Birthdate'},{id:'password',label:mode==='restore'?'Restore account':'Set password'},...(mode==='create'?[{id:'recovery',label:'Recovery phrase'}]:[]),{id:'goals',label:'Your goals'},{id:'skills',label:'Your skills'},...(roles.has('parent')?[{id:'child',label:'Link your child'}]:[]),{id:'done',label:'Complete'}];}
const primary=(text,action,extra='')=>`<button type="button" class="primary" data-action="${action}" ${extra}>${text}</button>`;
const secondary=(text,action)=>`<button type="button" class="secondary" data-action="${action}">${text}</button>`;
const back=()=>`<button type="button" class="back" data-action="back">← Back</button>`;
const avatar=(id,elementId='')=>`<div class="avatar" ${elementId?`id="${elementId}"`:''} style="--avatar-bg:${people[id].color}" aria-hidden="true">${people[id].initial}</div>`;
const field=(label,value,type='text')=>`<label class="field">${label}<input type="${type}" readonly value="${value}" autocomplete="off"></label>`;
function announce(){if(screen==='picker')el('launch-state').textContent='Existing device → choose a local profile. No private learning data is shown yet.';else if(screen==='unlock')el('launch-state').textContent=`Profile selection → ${people[selected].name}’s unlock screen. The avatar stays connected to the selection.`;else if(screen==='home')el('launch-state').textContent='End of this example: the safe destination appears after simulated account setup or unlock.';else el('launch-state').textContent=(fromPicker?'Add profile → ':scenario==='fresh'?'Fresh install → ':'Onboarding → ')+steps()[step].label+'. Account setup follows the existing wizard.';}
function welcome(){return `<div class="welcome"><img class="arrival-mark" id="arrival-mark" alt="" src="${logo}"><p class="eyebrow">Your learning. Your own.</p><h1>Start a new chapter.</h1><p class="sub">Free, decentralized learning.<br>Your credentials. Your identity. Your control.</p><div class="benefits"><div class="benefit"><span>01</span><div><b>Make it yours</b><small>Create an account protected on this device.</small></div></div><div class="benefit"><span>02</span><div><b>Keep your recovery phrase</b><small>Your personal backup, kept somewhere safe.</small></div></div><div class="benefit"><span>03</span><div><b>Find your next direction</b><small>Choose goals, bring your skills, start learning.</small></div></div></div><div class="actions center">${primary('Create account','create')}${secondary('Restore my account','restore')}</div>${fromPicker?'<button type="button" class="quiet" data-action="picker">Back to profiles</button>':''}<p class="footnote">I am, because we all are.</p></div>`;}
function onboarding(){const all=steps(),current=all[step];let panel='';
if(current.id==='welcome')panel=welcome();
if(current.id==='roles')panel=`${back()}<h1>What brings you here?</h1><p class="sub">Everyone is a learner. Add anything else that applies.</p><div class="option" aria-label="Learner, always included"><span class="check">✓</span><div class="option-body"><strong>Learner</strong><small>Take courses, earn credentials, grow your skills.</small></div><span class="small-tag">Always on</span></div>${[['instructor','Instructor','Share what you know. Create courses and teach.'],['parent','Parent or guardian','Support and follow your child’s learning.']].map(([id,title,desc])=>`<button type="button" class="option" data-action="role" data-value="${id}" aria-pressed="${roles.has(id)}"><span class="check">${roles.has(id)?'✓':''}</span><span class="option-body"><strong>${title}</strong><small>${desc}</small></span></button>`).join('')}<div class="actions">${primary('Continue','next')}</div>`;
if(current.id==='birthdate')panel=`${back()}<h1>When were you born?</h1><p class="sub">Set up the right learning experience for your age.</p>${field('Date of birth','1998-06-15','date')}<div class="quiet-panel"><strong>Adult learner example</strong><br>In the app, an under-18 account follows the guardian activation flow.</div><div class="actions">${primary('Continue','next')}</div>`;
if(current.id==='password')panel=`${back()}<h1>${mode==='restore'?'Welcome back.':'Make it yours.'}</h1><p class="sub">${mode==='restore'?'Restore your account and protect it with a password on this device.':'Your name and a password to protect your account on this device.'}</p>${mode==='restore'?'<div class="quiet-panel"><strong>Recovery phrase</strong><br>•••• •••• •••• •••• •••• ••••<br><small>Non-editable placeholder in this preview.</small></div>':''}<div class="field-row">${field('Display name','Sam Taylor')}${field('Username','samtaylor')}</div>${field('Password','sample-password-only','password')}${field('Confirm password','sample-password-only','password')}<p class="footnote">At least 12 characters. The example fields are filled for this walkthrough.</p><div class="actions">${primary(mode==='restore'?'Restore account':'Create my account','save-account','id="account-action"')}</div><div id="account-status" class="unlock-state" role="status"></div>`;
if(current.id==='recovery')panel=`<h1>Your secret backup.</h1><p class="sub">Keep your recovery phrase somewhere safe. It lets you restore your account.</p><div class="phrase" aria-label="24 recovery words hidden in this preview">${Array.from({length:24},(_,i)=>`<span><small>${String(i+1).padStart(2,'0')}</small>••••</span>`).join('')}</div><p class="footnote">Words stay hidden in this design preview. No recovery phrase is generated.</p><label class="inline-check"><input type="checkbox" id="backup-confirm" ${backup?'checked':''}>I have saved my recovery phrase.</label><div class="actions">${primary('Continue','next',backup?'':'disabled')}</div>`;
if(current.id==='goals')panel=`<h1>Where do you want<br>to go next?</h1><p class="sub">Choose a goal. Alexandria maps it to skills you can work toward.</p><button type="button" class="option" data-action="goal" aria-pressed="${goal}"><span class="check">${goal?'✓':''}</span><span class="option-body"><strong>Software engineer</strong><small>A sample job-role goal for this walkthrough.</small></span></button><div class="quiet-panel">You can add and change goals any time.</div><div class="actions">${primary(goal?'Continue with this goal':'Continue','next')}${secondary('Skip for now','skip-goal')}</div>`;
if(current.id==='skills')panel=`<h1>Bring what you<br>already know.</h1><p class="sub">A resume or transcript can help map your experience to skills.</p><div class="quiet-panel"><strong>${claimed?'Example resume mapped':'Add a resume or transcript'}</strong><br>${claimed?'Suggestions are claims, not verified achievements.':'Choose a document or describe your experience in the app.'}${claimed?'<p><span class="small-tag">Python · unverified</span><span class="small-tag">Problem solving · unverified</span></p>':''}</div>${secondary(claimed?'Reset example document':'Use example resume','document')}<div class="actions">${primary(claimed?'Continue with 2 skill claims':'Continue','next')}${secondary('Skip for now','skip-skills')}</div>`;
if(current.id==='child')panel=`<h1>Link your child.</h1><p class="sub">Use the invite code from your child’s activation screen. You can do this later.</p>${field('Invite code','Example code only')}<div class="actions">${primary('Do this later','next')}</div>`;
if(current.id==='done')panel=`<div class="welcome"><div class="success-seal" aria-hidden="true">✓</div><p class="eyebrow">Your next chapter</p><h1>You’re ready, Sam.</h1><p class="sub">${mode==='restore'?'Your account is restored in this example.':'Your account is set up in this example.'}<br>Start exploring at your own pace.</p><div class="quiet-panel"><strong>${goal?'Your goal: Software engineer':'Your first goal is yours to choose'}</strong><br>${claimed?'2 unverified skill claims; verification comes separately.':'You can add goals and skills whenever you’re ready.'}</div><div class="actions center">${primary('Enter Alexandria','enter')}</div></div>`;
return `<div class="app-body onboarding-layout"><aside class="rail"><p class="rail-title">Welcome to Alexandria</p><p class="rail-copy">A few steps to make it yours.</p><ol class="steps">${all.map((s,i)=>`<li class="${i===step?'current':i<step?'finished':''}" ${i===step?'aria-current="step"':''}><span class="step-dot">${i<step?'✓':i+1}</span>${s.label}</li>`).join('')}</ol></aside><main class="flow-panel"><p class="step-count">Step ${step+1} of ${all.length} · ${current.label}</p>${panel}</main></div>`;
}
function picker(){return `<main class="app-body picker"><p class="eyebrow">A place for everyone</p><h1>Who’s learning today?</h1><p class="sub">Pick a profile to continue, or add a new one.</p><div class="profile-grid">${Object.entries(people).map(([id,p])=>`<button type="button" class="profile-tile" data-action="profile" data-value="${id}" aria-label="Choose ${p.name}">${avatar(id)}<strong>${p.name}</strong><small>${p.last}</small></button>`).join('')}<button type="button" class="profile-tile" data-action="add"><span class="avatar add" aria-hidden="true">+</span><strong>Add profile</strong><small>Someone new</small></button></div><p class="profile-note">Each profile has its own password and learning history.</p></main>`;}
function unlock(){const p=people[selected];return `<main class="app-body"><div class="unlock">${back()}${avatar(selected,'selected-avatar')}<h1>Welcome back, ${p.name}.</h1><p class="sub">Enter your password to open your profile.</p>${field('Password','example-password','password')}<div class="actions">${primary('Unlock','unlock','id="unlock-action"')}</div>${p.biometric?`<div class="actions">${secondary('Use device unlock','unlock')}</div>`:''}<div class="unlock-state" id="unlock-status" role="status"></div></div></main>`;}
function home(){const returning=scenario==='existing'&&!fromPicker;return `<main class="app-body home"><p class="eyebrow">${returning?'Your learning continues':'A new beginning'}</p><h1>${returning?`Welcome back, ${people[selected].name}.`:'Make your first discovery.'}</h1><p class="sub">${returning?'Pick up where you left off.':'Your account is ready. There’s a whole world to explore.'}</p><div class="hero"><p class="eyebrow">${returning?'Continue learning':'Get started'}</p><h2>${returning?'Introduction to Python':goal?'Work toward software engineering':'Find something you’d love to learn'}</h2><p>${returning?'Lesson 3 · Functions and composition':goal?'Your selected goal is ready to explore.':'Browse courses or choose your first learning goal.'}</p></div><div class="home-grid"><div>Your goals<small>${returning||goal?'Software engineer':'Choose your direction'}</small></div><div>Your skills<small>${!returning&&claimed?'2 unverified claims':'Ready to explore'}</small></div></div><p class="footnote">Illustrative destination · no real profile was unlocked or created.</p><div class="actions">${secondary('Return to start','restart')}</div></main>`;}
function render(motion=true,focus=false){endBoot();cancelUI();el('fresh').setAttribute('aria-pressed',String(scenario==='fresh'));el('existing').setAttribute('aria-pressed',String(scenario==='existing'));const label=screen==='home'?'Profile open':screen==='picker'||screen==='unlock'?'Profiles on this device':fromPicker?'Add another profile':'Set up your account';el('content').innerHTML=`<header class="app-top"><div class="brand"><img class="mark" id="small-mark" src="${logo}" alt="">Alexandria</div><span class="device-label">${label}</span></header>${screen==='onboarding'?onboarding():screen==='picker'?picker():screen==='unlock'?unlock():home()}`;if(motion)animate(el('content').querySelector('.flow-panel')||el('content').querySelector('.app-body'),[{opacity:.1,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],220);if(focus){const h=el('content').querySelector('h1');h.tabIndex=-1;h.focus({preventScroll:true});}announce();}
function chooseProfile(id,button){const a=button.querySelector('.avatar'),rect=a.getBoundingClientRect(),copy=a.cloneNode(true);selected=id;screen='unlock';render(false,true);const dest=el('selected-avatar');if(reduced())return;const target=dest.getBoundingClientRect(),parent=el('product').getBoundingClientRect();copy.classList.add('flying-avatar');copy.style.left=(rect.x-parent.x-el('product').clientLeft)+'px';copy.style.top=(rect.y-parent.y-el('product').clientTop)+'px';copy.style.width=rect.width+'px';copy.style.height=rect.height+'px';el('product').append(copy);dest.style.opacity='0';const token=epoch;const anim=animate(copy,[{transform:'translate(0,0) scale(1)'},{transform:`translate(${target.x-rect.x}px,${target.y-rect.y}px) scale(${target.width/rect.width})`}],280);anim.finished.then(()=>{copy.remove();if(token===epoch&&dest.isConnected)dest.style.opacity='';}).catch(()=>{});}
function restart(){step=0;mode='create';roles=new Set();goal=false;claimed=false;backup=false;fromPicker=false;screen=scenario==='fresh'?'onboarding':'picker';render(false);}
function next(){step=Math.min(step+1,steps().length-1);render(true,true);}
root.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
if(action==='profile'){chooseProfile(button.dataset.value,button);return;}
if(action==='create'||action==='restore'){mode=action==='restore'?'restore':'create';step=1;render(true,true);return;}
if(action==='add'){fromPicker=true;screen='onboarding';step=0;mode='create';roles=new Set();goal=false;claimed=false;backup=false;render(true,true);return;}
if(action==='picker'){screen='picker';render(true,true);return;}
if(action==='back'){if(screen==='unlock')screen='picker';else step=Math.max(0,step-1);render(true,true);return;}
if(action==='role'){const id=button.dataset.value;roles.has(id)?roles.delete(id):roles.add(id);render(false);el('content').querySelector(`[data-value="${id}"]`).focus();return;}
if(action==='goal'){goal=!goal;render(false);el('content').querySelector('[data-action="goal"]').focus();return;}
if(action==='document'){claimed=!claimed;render(false);el('content').querySelector('[data-action="document"]').focus();return;}
if(action==='skip-goal'){goal=false;next();return;}if(action==='skip-skills'){claimed=false;next();return;}
if(action==='next'){next();return;}
if(action==='save-account'||action==='unlock'){const isUnlock=action==='unlock',status=el(isUnlock?'unlock-status':'account-status');const actions=Array.from(el('content').querySelectorAll('button'));actions.forEach(b=>b.disabled=true);button.setAttribute('aria-busy','true');status.textContent=isUnlock?'Unlocking profile…':mode==='restore'?'Restoring account…':'Creating account…';const token=epoch;flowTimer=setTimeout(()=>{if(token!==epoch)return;if(isUnlock){screen='home';fromPicker=false;render(true,true);}else next();},450);return;}
if(action==='enter'){screen='home';render(true,true);return;}
if(action==='restart'){restart();}
});
root.addEventListener('change',event=>{if(event.target.id==='backup-confirm'){backup=event.target.checked;const next=el('content').querySelector('[data-action="next"]');next.disabled=!backup;}});
function policy(){root.classList.toggle('reduced',reduced());if(reduced()){endBoot();cancelUI(false);}el('reduce').disabled=os.matches;el('reduce').checked=reduced();}
el('reduce').addEventListener('change',()=>{requestedReduced=el('reduce').checked;policy();});os.addEventListener('change',policy);
el('theme').addEventListener('change',()=>{endBoot();cancelUI(false);el('product').dataset.theme=el('theme').value;});
el('fresh').addEventListener('click',()=>{scenario='fresh';restart();});el('existing').addEventListener('click',()=>{scenario='existing';restart();});
el('replay').addEventListener('click',()=>{restart();startOpening();});
function skipOpening(){if(el('boot').hidden)return;endBoot();announce();}
el('boot').addEventListener('pointerdown',skipOpening);el('boot-skip').addEventListener('click',skipOpening);
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!el('boot').hidden){event.preventDefault();skipOpening();}else if(screen==='unlock'){screen='picker';render(true,true);}}});
let stageWidth=0,stageHeight=0;
const resize=new ResizeObserver(()=>{const w=el('product').offsetWidth,h=el('product').offsetHeight;if(stageWidth&&(w!==stageWidth||h!==stageHeight)){endBoot();}stageWidth=w;stageHeight=h;});resize.observe(el('product'));
document.addEventListener('visibilitychange',()=>{if(document.hidden)endBoot();});window.addEventListener('pagehide',()=>{endBoot();cancelUI();resize.disconnect();});
render(false);policy();
})();</script></body></html>
