[package]
name = "alexandria-ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "AGPL-3.0-or-later"
description = "Provider-independent model requests, endpoint policy, and bounded streaming for Alexandria"

[dependencies]
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
