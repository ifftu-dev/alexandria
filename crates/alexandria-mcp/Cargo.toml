[package]
name = "alexandria-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "AGPL-3.0-or-later"

[dependencies]
rmcp = { version = "=3.3.0", features = ["transport-io"] }
alexandria-verify = { path = "../alexandria-verify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
futures = "0.3"
libc = "0.2"
tokio-util = { version = "0.7", features = ["codec"] }
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "time"] }

[dev-dependencies]
rmcp = { version = "=3.3.0", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["process", "time"] }
tempfile = "3"
