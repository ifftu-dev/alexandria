[package]
name = "live"
version = "0.1.0"
edition = "2024"
description = "Live tutoring networking: MoQ media + gossip room presence over iroh"
license = "MIT OR Apache-2.0"

[dependencies]
derive_more = { version = "2.0.1", features = ["display", "debug", "eq"] }
iroh = "1.0.2"
iroh-gossip = "0.101"
iroh-moq = { path = "../iroh-moq" }
iroh-tickets = "1.0"
moq-lite = "0.17"
moq-media = { version = "0.1.0", path = "../moq-media", default-features = false }
n0-error = { version = "1", features = ["anyhow"] }
n0-future = "0.3.1"
postcard = "1.1.3"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["sync"] }
tracing = "0.1.41"

[features]
default = ["video", "aec"]

# Acoustic Echo Cancellation (requires webrtc-audio-processing, which does not
# cross-compile to iOS).
aec = ["moq-media/aec"]

# Full video + audio support (ffmpeg + camera/screen capture).
video = ["moq-media/video"]

# iOS-only video support (VideoToolbox H264, no ffmpeg/nokhwa/xcap).
video-ios = ["moq-media/video-ios"]

# Static build of ffmpeg (implies video).
static = ["video", "moq-media/static"]
