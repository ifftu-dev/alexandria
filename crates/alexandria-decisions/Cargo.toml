[package]
name = "alexandria-decisions"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bounded optional typed decision client for Alexandria"

[dependencies]
alexandria-learning-contracts = { version = "0.1.0", path = "../alexandria-learning-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
