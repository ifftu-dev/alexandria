[package]
name = "alexandria-verify"
version = "0.1.0"
description = "Alexandria credential verification — W3C VCs, did:key, JCS canonicalization, detached Ed25519 JWS"
edition = "2021"
rust-version = "1.83.0"
license = "MIT OR Apache-2.0"

# Permissive, deliberately, while the rest of Alexandria is AGPL-3.0-or-later.
#
# The project guarantees that credential verification is free, offline-capable
# and permanent, and that anyone may implement it. An AGPL verification library
# would contradict that: an HR platform, a registrar or an ATS embedding it
# would have to publish their own product under the AGPL, which makes verifying
# an Alexandria credential legally expensive for precisely the parties the
# guarantee is aimed at. Protocol and verification libraries are normally
# permissive even where the application is copyleft, for this reason.
#
# The application keeps its copyleft. What is permissive is the ability to check
# a signature, which is the part that has to be everywhere to be worth anything.
#
# This crate is deliberately I/O-free. It has no database, no network, no
# filesystem and no platform dependencies, so that anything which needs to
# verify an Alexandria credential — the desktop app, the CLI, a server, or a
# third party writing their own verifier — links a signature checker rather
# than an application. Persistence enters through the `VerificationStore`
# trait, which callers implement over whatever store they actually have.
#
# Adding a dependency here that reaches the outside world defeats the point.
# `tests/no_io_deps.rs` enforces that.

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
blake2 = "0.10"
blake3 = "1"
sha2 = "0.10"
base64 = "0.21"
thiserror = "2"
hex = "0.4"
bs58 = "0.5"
