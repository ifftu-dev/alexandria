[package]
name = "alexandria-verify"
version = "0.9.0"
description = "Alexandria credential verification — W3C VC Data Model 2.0, Data Integrity eddsa-jcs-2022, Bitstring Status List, did:key"
edition = "2021"
rust-version = "1.83.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ifftu-dev/alexandria"
homepage = "https://alexandria.ifftu.dev"
documentation = "https://docs.rs/alexandria-verify"
readme = "README.md"
keywords = ["credentials", "did", "ed25519", "data-integrity", "w3c"]
categories = ["cryptography", "authentication"]

# Permissive, deliberately, while the rest of Alexandria is AGPL-3.0-or-later.
#
# The project guarantees that credential verification is free, offline-capable
# and permanent, and that anyone may implement it. An AGPL verification library
# would contradict that: an HR platform, a registrar or an ATS embedding it
# would have to publish their own product under the AGPL, which makes verifying
# an Alexandria credential legally expensive for precisely the parties the
# guarantee is aimed at. Protocol and verification libraries are normally
# permissive even where the application is copyleft, for this reason.
#
# The application keeps its copyleft. What is permissive is the ability to check
# a signature, which is the part that has to be everywhere to be worth anything.
#
# This crate is deliberately I/O-free. It has no database, no network, no
# filesystem and no platform dependencies, so that anything which needs to
# verify an Alexandria credential — the desktop app, the CLI, a server, or a
# third party writing their own verifier — links a signature checker rather
# than an application. Persistence enters through the `VerificationStore`
# trait, which callers implement over whatever store they actually have.
#
# Adding a dependency here that reaches the outside world defeats the point.
# `tests/no_io_deps.rs` enforces that.

[dependencies]
alexandria-learning-contracts = { version = "0.1.0", path = "../alexandria-learning-contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3"
ed25519-dalek = { version = "2", features = ["serde", "rand_core", "zeroize"] }
blake2 = "0.10"
blake3 = "1"
sha2 = "0.10"
base64 = "0.21"
thiserror = "2"
hex = "0.4"
bs58 = "0.5"
# Pure-Rust GZIP for Bitstring Status List encodedList; no I/O.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Device attestation checking (`attestation` feature): App Attest is a CBOR
# attestation object, an X.509 chain to Apple's root (signature checks by
# x509-parser's `verify`, over ring) and ECDSA P-256 assertions; Play
# Integrity is a JWE (A256KW + A256GCM) around an ES256 JWS. All pure crypto.
minicbor = { version = "0.25", default-features = false, optional = true }
x509-parser = { version = "0.17", features = ["verify"], optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"], optional = true }
aes = { version = "0.8", optional = true }
aes-gcm = { version = "0.10", optional = true }
# Synthetic attestation fixtures (`test-support` only).
rcgen = { version = "0.13", optional = true }

[features]
default = []
# Verify the device attestation evidence a credential carries. Without it,
# evidence entries still parse and verify as `unverifiable`, so a minimal
# verifier carries no certificate-chain code.
attestation = ["dep:minicbor", "dep:x509-parser", "dep:p256", "dep:aes", "dep:aes-gcm"]
# Deterministic synthetic App Attest chains and Play Integrity tokens for the
# tests of crates that verify attestation. Never enable in a shipped build.
test-support = ["attestation", "dep:rcgen"]

[dev-dependencies]
# `hazmat` signs with a non-default nonce, producing a second valid signature
# over identical genesis bytes for the DAO-id regression test.
ed25519-dalek = { version = "2", features = ["hazmat"] }
# The attestation fixtures (`src/attestation/test_support.rs`), which the
# attestation vectors include directly so they build with or without the
# feature.
rcgen = "0.13"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
aes = "0.8"
aes-gcm = "0.10"
