[package]
name = "language-lab-grader"
version = "1.0.0"
edition = "2021"
description = "Alexandria built-in Language Lab grader (dictation, reading, writing, sentence builder). Compiled to wasm32-unknown-unknown and run inside the deterministic Wasmtime sandbox."
license = "MIT OR Apache-2.0"
publish = false

[lib]
# cdylib for the wasm artifact; rlib so `cargo test` can link the unit tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
