[workspace]
resolver = "2"
members = [
    "src-tauri",
    "cli",
    "crates/alexandria-verify",
    "crates/iroh-moq",
    "crates/moq-media",
    "crates/live",
]
# Built-in plugin graders compile to wasm32-unknown-unknown and live
# outside the desktop/mobile workspace so the main build doesn't try to
# pull them in for the host target. Each grader has its own Cargo.toml
# and is built via `cargo build --target wasm32-unknown-unknown --release`
# from inside its directory. The resulting `.wasm` is checked in next to
# the source so reproducibility tests don't need a wasm toolchain at
# CI time.
exclude = ["plugins"]

# Stronghold uses scrypt internally for snapshot encryption.
# Without opt-level = 3, scrypt is 10-30x slower in debug builds,
# making vault unlock/create painfully slow during development.
[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# ── Crate patches ─────────────────────────────────────────────────────
# if-watch 3.2.1 uses SCDynamicStore on iOS which returns NULL and panics.
# Our patch routes iOS to the fallback (timer-based) backend instead.
[patch.crates-io]
# netdev 0.45 (via netwatch → iroh 1.0) aborts on iOS: its interface
# enumeration augments getifaddrs with macOS-only Network.framework /
# SystemConfiguration / route data and unwraps a None, crashing the p2p node
# right after wallet unlock. Our patch returns the plain getifaddrs list.
netdev = { path = "patches/netdev" }
if-watch = { path = "patches/if-watch" }
audiopus_sys = { path = "patches/audiopus_sys" }
webrtc-audio-processing-sys = { path = "patches/webrtc-audio-processing-sys" }
ffmpeg-sys-next = { path = "patches/ffmpeg-sys-next" }
ffmpeg-next = { path = "patches/ffmpeg-next" }
# swift-rs 1.0.8 promotes Xcode 27's internalized @_cdecl exports back to global,
# but only in each package's own object member. Its own Swift runtime is vendored
# into every archive as SwiftRs.o, so retain_object/release_object/string_from_bytes
# stay internal everywhere and no iOS link can resolve them. Our patch promotes
# those three as weak globals, which coalesce across archives.
swift-rs = { path = "patches/swift-rs" }
# tao 0.35.3 returns the UISceneConfiguration from
# application:configurationForConnectingSceneSession: with `Retained::as_ptr`,
# which only borrows — the Retained then releases it as the function returns.
# UIKit retains freed memory a moment later and the app dies in objc_retain
# before its first frame. Our patch autoreleases the return instead.
tao = { path = "patches/tao" }

# live / iroh-moq / moq-media are owned in-tree under crates/ (on iroh 1.0),
# referenced by path from src-tauri — no git dependency or patch. `live` is our
# own room/session layer (replaced the vendored n0 iroh-live crate); iroh-moq +
# moq-media are the kept MoQ transport + media crates.
