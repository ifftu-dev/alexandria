# cargo-audit configuration.
#
# Every ignore names the advisory, why it is not exploitable here, and what
# would make it exploitable again. An ignore without that is how a real
# advisory gets buried in a list nobody reads.

[advisories]
ignore = [
    # libsqlite3-sys 0.36.0 — SQLite before 3.54.0 can return uninitialised
    # page-cache memory when it opens a database with a sibling `-wal` file
    # of a different page size (RUSTSEC-2026-0459, CVE-2026-119375; local,
    # needs the victim to open crafted files).
    #
    # Ignored because the patched release would not patch us: every build
    # here uses `bundled-sqlcipher`, and even libsqlite3-sys 0.39.x builds
    # SQLCipher from `sqlcipher-src =419.0.6`, which bundles the affected
    # SQLite 3.53.4. Upgrading rusqlite would only silence this check.
    #
    # Exposure is also narrow: the app and CLI open only their own profile
    # databases, under the app's data directory, keyed with SQLCipher, whose
    # per-page HMAC rejects pages written without the key. A party able to
    # plant a crafted database and WAL there already controls the profile.
    #
    # Revisit when sqlcipher-src bundles SQLite >= 3.54.0 (then upgrade
    # rusqlite), and immediately if any path opens a database file supplied
    # by someone else.
    "RUSTSEC-2026-0459",

    # tract-nnef 0.21.10 — integer overflow in the NNEF tensor parser giving an
    # out-of-bounds read on model load (RUSTSEC-2026-0217, CVSS 6.1).
    #
    # Ignored because the upgrade is genuinely blocked: tract 0.21.16 pins
    # `half = "=2.4.1"` (exact), and naga 27 — via wgpu, eframe, and the
    # vendored moq-media crate — requires `half ^2.5`. There is no version of
    # `half` that satisfies both, so `cargo update -p tract-onnx` fails to
    # resolve.
    #
    # The vulnerable path is untrusted model bytes reaching the parser, and no
    # such path exists: the community classifier-weights loader is deleted and
    # no command accepts model bytes. The two paths that reach tract, the paste
    # classifier and the face detector, parse fixed model bytes embedded at
    # build time. Any future path that loads a model from outside the binary
    # must verify its exact bytes against a pinned digest before the parser, or
    # remove this acceptance.
    #
    # Revisit when tract relaxes its `half` pin, or when the media stack moves
    # to a wgpu/naga release that accepts `half 2.4`.
    "RUSTSEC-2026-0217",

    # rkyv 0.7.x — insufficient archive validation, out-of-bounds reads on
    # archives containing Rc/Arc (RUSTSEC-2026-0235).
    #
    # The package remains in Cargo.lock as rust_decimal's optional rkyv 0.7
    # integration, but that feature is not activated in any workspace target:
    # `cargo tree --workspace --target all --edges all -i rkyv@0.7.46` is
    # empty. Nothing in this codebase constructs or deserializes an rkyv
    # archive. The fix is >= 0.8.17, a semver-major move for any dependency
    # that later activates the integration.
    #
    # Revisit whenever that tree becomes non-empty, and immediately if any
    # code path starts deserializing rkyv data that came off the network.
    "RUSTSEC-2026-0235",

    # quick-xml 0.30.0 and 0.39.4 — unbounded namespace-declaration allocation
    # (RUSTSEC-2026-0195) and quadratic runtime on duplicate attribute names
    # (RUSTSEC-2026-0194). Both are denial-of-service on hostile XML.
    #
    # Neither copy parses runtime input:
    #   - 0.30.0 is an `xcb` build-dependency reached through `xcap`; it parses
    #     the dependency's protocol definition XML while building on Linux.
    #   - 0.39.4 is reached through `wayland-scanner`; it likewise parses
    #     dependency protocol definition XML while building Linux GUI code.
    #
    # Both are pinned by their dependents (`cargo update -p quick-xml@…` is a
    # no-op), so the fix has to come from `wayland-scanner` and `xcb` releasing
    # against >= 0.41. Revisit immediately if either version enters a runtime
    # path or parses user-controlled XML.
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0194",

    # hickory-proto 0.25.x — CPU exhaustion in message encoding
    # (RUSTSEC-2026-0119) and an unbounded NSEC3 validation loop
    # (RUSTSEC-2026-0118, no fix at any version).
    #
    # The 0.25 package remains in Cargo.lock beneath `libp2p-mdns`, but the
    # workspace's explicit libp2p feature set does not enable mDNS and the
    # resolved all-target tree for hickory-proto 0.25.2 is empty. The active
    # DNS stack uses hickory-proto 0.26.1.
    #
    # Remove these accepts when the stale lock record disappears. Re-evaluate
    # immediately if libp2p mDNS is enabled or any other 0.25 consumer enters
    # the resolved graph.
    "RUSTSEC-2026-0119",
    "RUSTSEC-2026-0118",

    # ringbuf 0.4.8 — `Consumer::skip` and `Consumer::clear` are not
    # panic-safe: if an element's `Drop` panics mid-loop the read index is not
    # advanced, and the ring buffer's own destructor drops those elements again
    # (RUSTSEC-2026-0293, double free / use-after-free).
    #
    # Ignored because the upgrade is blocked: ringbuf 0.4 comes in through the
    # firewheel 0.10 audio stack under the vendored moq-media crate, and
    # firewheel only moves to ringbuf ^0.5 in 0.12, a two-release breaking port
    # of moq-media's audio code.
    #
    # The bug needs execution to continue after a panicking `Drop`, and shipped
    # builds cannot do that: the release profile sets `panic = "abort"`, so the
    # first panic ends the process before any second drop. The only direct
    # caller of `skip`/`clear` in the tree, fixed-resample's resampling channel,
    # also holds `Sample` elements, which are `Copy` and have no `Drop` at all.
    #
    # Revisit when moq-media moves to firewheel >= 0.12. Remove this acceptance
    # immediately if the release profile stops aborting on panic, or if code
    # starts catching panics (`catch_unwind`) around the audio stack.
    "RUSTSEC-2026-0293",

    # zip 1.1.4, 4.6.1 and 8.6.0 — `ZipArchive::extract` and
    # `ZipStreamReader::extract` keep SUID/SGID bits (RUSTSEC-2026-0367),
    # create symlinks whose targets leave the destination (RUSTSEC-2026-0368),
    # apply permissions through those symlinks (RUSTSEC-2026-0369), and
    # abort on oversized symlink-target allocation (RUSTSEC-2026-0429).
    #
    # Accepted based on the extraction boundaries below, not on panic
    # handling: allocation failure aborts even with panic = "unwind".
    # Checked 2026-11-03: candle-core 0.11.1 and tauri-plugin-updater 2.14.1
    # support zip 9, but libsodium-sys-stable 1.24.3 still requires ^8.6.
    # Keep the existing application dependencies for this patch release;
    # dependency upgrades can narrow this exception in a separate change.
    #
    # All four bugs live in `extract`, and nothing extracts an archive that
    # an attacker can supply:
    #   - candle-core 0.8.4 (zip 1.1.4) reads PyTorch archives with `by_name`
    #     only and never calls `extract`.
    #   - tauri-plugin-updater 2.10.1 (zip 4.6.1) extracts only on Windows,
    #     only for a .zip update bundle, and only after `download_and_install`
    #     has verified the bytes against the minisign `pubkey` in
    #     tauri.conf.json. It extracts into a fresh temporary directory.
    #   - libsodium-sys-stable 1.24.0 (zip 8.6.0) is a build dependency. Its
    #     build script extracts the prebuilt MSVC libsodium on Windows builds
    #     only, after verifying the archive's minisign signature.
    #
    # Revisit with dependency upgrades, especially libsodium accepting zip 9.
    # Remove this acceptance immediately if our code calls `extract` itself, if the
    # updater stops verifying signatures before install, or if candle starts
    # extracting archives.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",

    # crypto-bigint 0.5.5 — timing variability in operations meant to be
    # constant-time (RUSTSEC-2026-0387). The fix is >= 0.7.6, a semver-major
    # move: 0.5 is pinned by elliptic-curve 0.13, which p256 0.13 and k256
    # 0.13 (via iota-crypto, via iota_stronghold) require.
    #
    # Timing leaks matter where secret values pass through the arithmetic.
    # Here p256 only verifies public signatures over public inputs (network
    # profile trust roots, App Attest, Play Integrity); it signs only in
    # tests. k256 is linked through Stronghold, but Alexandria calls no
    # secp256k1 procedure. No secret key ever reaches crypto-bigint 0.5.
    #
    # Revisit if any code signs, derives, or agrees keys with p256 or k256
    # (ECDSA signing, ECDH), or when p256/k256 release on elliptic-curve
    # with crypto-bigint >= 0.7.6.
    "RUSTSEC-2026-0387",

    # hickory-proto 0.25.2 — panics in zone-file and SVCB/HTTPS text parsing
    # (RUSTSEC-2026-0487, -0489, -0490) and memory amplification from DNS
    # header record counts (RUSTSEC-2026-0491). The fix is >= 0.26.2; the
    # 0.26 copy used by iroh and our resolver is on 0.26.3.
    #
    # hickory-proto / hickory-resolver 0.25.2 — DNSSEC validation flaws:
    # inverted and unscoped NSEC3 checks (RUSTSEC-2026-0504, -0505), NXDOMAIN
    # accepted for an empty non-terminal (RUSTSEC-2026-0511), an unrelated
    # signed RRset accepted as the answer (RUSTSEC-2026-0512), and lookups
    # returning records that failed validation (RUSTSEC-2026-0514). 0.26.x is
    # unaffected.
    #
    # 0.25.2 is only a lockfile entry: libp2p 0.56 pins it for its optional
    # `dns` and `mdns` features, which no workspace crate enables, so it is
    # never compiled (`cargo tree --all-features --target all -i
    # hickory-proto@0.25.2` prints nothing). These ignores name the advisory
    # IDs, so they also cover 0.26.x; the 0.26 copy must stay >= 0.26.2.
    #
    # Remove when libp2p moves to hickory 0.26, and immediately if anything
    # enables libp2p's `dns` or `mdns` features.
    "RUSTSEC-2026-0487",
    "RUSTSEC-2026-0489",
    "RUSTSEC-2026-0490",
    "RUSTSEC-2026-0491",
    "RUSTSEC-2026-0504",
    "RUSTSEC-2026-0505",
    "RUSTSEC-2026-0511",
    "RUSTSEC-2026-0512",
    "RUSTSEC-2026-0514",
]
