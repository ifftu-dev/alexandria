<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Alexandria</title>
  </head>
  <body>
    <script>
      // Apply theme class + background before anything renders
      ;(function () {
        var t = 'system'
        var motion = 'system'
        try {
          t = localStorage.getItem('alexandria-theme-pre-unlock') || 'system'
          motion = localStorage.getItem('alexandria-motion') || 'system'
        } catch (_) {}
        document.documentElement.dataset.motion = motion === 'off' ? 'off'
          : motion === 'reduced' || window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'full'
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.backgroundColor = '#111827'
        } else {
          document.documentElement.style.backgroundColor = '#f7f6f3'
        }
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
