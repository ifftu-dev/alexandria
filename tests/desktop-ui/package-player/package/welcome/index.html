<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Welcome to the workshop</title>
    <script src="../shared/lesson.js"></script>
  </head>
  <body>
    <h1>Welcome to the workshop</h1>
    <p id="page"></p>
    <button id="next" type="button">Next page</button>
    <button id="leave" type="button">Save and leave</button>
    <button id="done" type="button">Finish lesson</button>
    <button id="enlarge" type="button">Full screen</button>
    <button id="glossary" type="button">Open the glossary</button>
    <button id="remote" type="button">Show the remote picture</button>
    <button id="alert" type="button">Show an alert</button>
    <pre id="seen"></pre>
    <script>
      // A lesson of several pages. It keeps its page as the bookmark and the
      // pages seen as suspend data, so a resumed session carries on.
      lesson.start([
        'cmi.core.student_id',
        'cmi.core.student_name',
        'cmi.core.entry',
        'cmi.core.lesson_location',
        'cmi.core.lesson_status',
        'cmi.suspend_data',
      ]);
      var page = Number(lesson.get('cmi.core.lesson_location').replace('page-', '')) || 1;
      document.getElementById('page').textContent = 'Page ' + page;

      document.getElementById('next').addEventListener('click', function () {
        page += 1;
        document.getElementById('page').textContent = 'Page ' + page;
        lesson.set('cmi.core.lesson_location', 'page-' + page);
        var seen = lesson.get('cmi.suspend_data');
        lesson.set('cmi.suspend_data', seen ? seen + ',' + page : '1,' + page);
        lesson.set('cmi.core.lesson_status', 'incomplete');
        lesson.commit();
      });
      document.getElementById('leave').addEventListener('click', function () {
        lesson.set('cmi.core.exit', 'suspend');
        lesson.finish();
      });
      document.getElementById('done').addEventListener('click', function () {
        lesson.set('cmi.core.lesson_status', 'completed');
        lesson.set('cmi.core.session_time', '0000:02:00');
        lesson.finish();
      });
      document.getElementById('enlarge').addEventListener('click', function () {
        document.documentElement.requestFullscreen().catch(function (error) {
          lesson.show('fullscreen', error.name);
        });
      });
      document.getElementById('glossary').addEventListener('click', function () {
        window.open('glossary.html', 'glossary', 'width=400,height=300');
      });
      document.getElementById('remote').addEventListener('click', function () {
        var picture = new Image();
        picture.src = 'https://images.example.com/forklift.png';
        document.body.appendChild(picture);
      });
      document.getElementById('alert').addEventListener('click', function () {
        lesson.show('alert', String(window.alert('Wear your goggles')));
      });
    </script>
  </body>
</html>
