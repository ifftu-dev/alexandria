<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lesson launched inside its own frame</title>
  </head>
  <body>
    <!-- Many packages launch a page of their own that frames the real lesson,
         which puts the lesson two frames below the API. -->
    <iframe id="inner" title="Lesson content" src="lesson.html"></iframe>
  </body>
</html>
