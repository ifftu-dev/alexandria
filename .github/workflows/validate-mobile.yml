name: Validate (Mobile)

on:
  workflow_dispatch:
    inputs:
      dev_seeding:
        description: 'Enable the development-only test data picker (validation only)'
        required: false
        type: boolean
        default: false
      tag:
        description: 'Immutable tag to validate'
        required: true
        type: string
      include_android:
        description: 'Validate Android artifacts'
        required: false
        type: boolean
        default: true
      include_ios:
        description: 'Validate iOS artifacts'
        required: false
        type: boolean
        default: false
      ios_export_method:
        description: 'iOS export mode for validation'
        required: false
        type: choice
        default: debugging
        options:
          - debugging
          - release-testing
          - app-store-connect

permissions:
  contents: read

jobs:
  validate-mobile:
    uses: ./.github/workflows/mobile-shared.yml
    with:
      mode: validate
      dev_seeding: ${{ inputs.dev_seeding }}
      tag: ${{ inputs.tag }}
      include_android: ${{ inputs.include_android }}
      include_ios: ${{ inputs.include_ios }}
      ios_export_method: ${{ inputs.ios_export_method }}
    secrets: inherit
