name: Personhood Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/personhood-lab.yml'
      - 'tools/personhood-prover/**'
      - 'tools/personhood-tests/**'
      - 'scripts/prepare-personhood-lab.py'
      - 'src-tauri/gen/android/app/src/main/java/org/alexandria/node/PersonhoodKeyTransfer.kt'
      - 'src-tauri/gen/android/app/src/test/**'
      - 'src-tauri/gen/android/gradle/wrapper/**'
      - 'src-tauri/gen/android/gradlew'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/personhood-lab.yml'
      - 'tools/personhood-prover/**'
      - 'tools/personhood-tests/**'
      - 'scripts/prepare-personhood-lab.py'
      - 'src-tauri/gen/android/app/src/main/java/org/alexandria/node/PersonhoodKeyTransfer.kt'
      - 'src-tauri/gen/android/app/src/test/**'
      - 'src-tauri/gen/android/gradle/wrapper/**'
      - 'src-tauri/gen/android/gradlew'

permissions:
  contents: read

concurrency:
  group: personhood-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-worker-and-download:
    name: ARM64 worker and download tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Test production download code without the Tauri build
        run: bash src-tauri/gen/android/gradlew -p tools/personhood-tests test --no-daemon

      - name: Setup Rust 1.91.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.91.0
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Setup pinned Android NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools ndk;26.3.11579264'

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang nasm

      - name: Compile and lint the pinned ARM64 prover
        run: python3 scripts/prepare-personhood-lab.py --ndk "$ANDROID_HOME/ndk/26.3.11579264" --check
