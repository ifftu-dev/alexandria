name: alexandria-node
options:
  bundleIdPrefix: org.alexandria.node
  deploymentTarget:
    iOS: 14.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Alexandria
      PRODUCT_BUNDLE_IDENTIFIER: org.alexandria.node
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  alexandria-node_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: alexandria-node_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: alexandria-node_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "0.1.0"
        # App uses only standard, exempt encryption — suppresses the
        # per-upload TestFlight export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        # Required from the iOS 26 SDK onwards, and fatal from iOS 27.
        #
        # UIKit checks for scene-lifecycle adoption when it creates the first
        # scene. An app without this key used to get a runtime issue logged;
        # built against the iOS 26+ SDK it now traps —
        # _UIApplicationEvaluateRuntimeIssueForNoSceneLifecycleAdoption raises
        # EXC_BREAKPOINT inside -[UIApplication workspace:didCreateScene:],
        # which is before main.mm's start_app() has produced anything. The app
        # dies on launch, no Rust code runs, and the crash report names UIKit
        # rather than us.
        #
        # Declaring the key is the adoption UIKit looks for, and `true` is the
        # value tao actually supports rather than the conservative-looking one.
        # tao reads this key to decide whether it is in scene mode at all
        # (`multiple_scenes_enabled`): only when it is true does it install
        # `application:configurationForConnectingSceneSession:`, hand UIKit its
        # TaoSceneDelegate, defer did_finish_launching to the first scene, and
        # attach the UIWindow to a scene. Set to false, UIKit still runs the
        # scene lifecycle but tao stays in its legacy path — the window is
        # created with no windowScene and never becomes visible. A launch that
        # no longer traps but shows nothing is not an improvement.
        #
        # No UISceneConfigurations entry, because tao supplies the configuration
        # programmatically from that delegate method and the delegate method
        # wins over the plist.
        #
        # On iPhone this changes nothing: UIApplication.supportsMultipleScenes
        # is false there whatever the manifest says, and tao's own else-branch
        # then moves the window onto the single connected scene. It does allow
        # multiple windows on iPad, which is a behaviour change to make
        # deliberately if iPad is ever a target.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    entitlements:
      path: alexandria-node_iOS/alexandria-node_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(DT_TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(DT_TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(TOOLCHAIN_DIR)/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: TAURI_IOS_CLI="${SRCROOT}/../../../node_modules/.bin/tauri"; if [ -x "$TAURI_IOS_CLI" ]; then "$TAURI_IOS_CLI" ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}; else export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:${HOME}/.cargo/bin:${PATH}" && cargo-tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}; fi
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
